<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="index.js"></script>
</head>
<body>
    <div class="box">
        <div class="top-buttons">
            <button id="toggle-size" class="buttons-actions top-button">⇱</button>
            <div>
                <button id="toggle-scientific" class="buttons-actions top-button">√</button>
                <button class="buttons-actions top-button">⚙️</button>
            </div>
        </div>
        <div class="operations">
            <input onblur="this.focus()" autofocus type="text" name="" id="expression">
            <div id="result" class="result-display" aria-live="polite"></div>
        </div>
        <div class="divider"></div>
        
        <div class="actions">
            <div class="scientific-section">
                <div class="column">
                    <button class="buttons-scientific">INV</button>
                    <button class="buttons-scientific">sin</button>
                    <button class="buttons-scientific">ln</button>
                    <button class="buttons-scientific">π</button>
                    <button class="buttons-scientific">(</button>
                </div>
                <div class="column">
                    <button class="buttons-scientific">DEG</button>
                    <button class="buttons-scientific">cos</button>
                    <button class="buttons-scientific">log</button>
                    <button class="buttons-scientific">e</button>
                    <button class="buttons-scientific">)</button>
                </div>
                <div class="column">
                    <button class="buttons-scientific">x!</button>
                    <button class="buttons-scientific">tan</button>
                    <button class="buttons-scientific">xʸ</button>
                    <button class="buttons-scientific">√</button>
                    <button class="buttons-scientific">x²</button>
                </div>
            </div>
            <div class="column">
                <button class="buttons-actions button-clear">C</button>
                <button class="buttons-numbers">7</button>
                <button class="buttons-numbers">4</button>
                <button class="buttons-numbers">1</button>
                <button class="buttons-numbers">%</button>
            </div>
            <div class="column">
                <button class="buttons-actions">÷</button>
                <button class="buttons-numbers">8</button>
                <button class="buttons-numbers">5</button>
                <button class="buttons-numbers">2</button>
                <button class="buttons-numbers">0</button>
            </div>
            <div class="column">
                <button class="buttons-actions">×</button>
                <button class="buttons-numbers">9</button>
                <button class="buttons-numbers">6</button>
                <button class="buttons-numbers">3</button>
                <button class="buttons-numbers">.</button>
            </div>
            <div class="column">
                <button class="buttons-actions button-delete">⌫</button>
                <button class="buttons-actions">-</button>
                <button class="buttons-actions">+</button>
                <button class="button-result">=</button>
            </div>
        </div>
    </div>
</body>
</html>
